<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* Inlined so the slide-out menu still works even if css/style.css is briefly out of date on your site. */
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
#backdrop.open{display:block}
#drawer{position:fixed;top:0;left:0;bottom:0;width:230px;max-width:80vw;background:#fff;border-right:1px solid #dde2e8;
  transform:translateX(-100%);transition:transform .2s;z-index:20;overflow-y:auto}
#drawer.open{transform:translateX(0)}
</style>
</head>
<body>
<div id="backdrop"></div>
<nav id="drawer"><div class="lab" style="padding:10px 14px 4px">My Ledger</div><div id="nav"></div></nav>
<main>
<header>
  <button class="ghost" id="menu" aria-label="Menu">☰</button>
  <h1>My Ledger</h1>
  <div><span id="st"></span> <button class="ghost" id="hide" aria-label="Hide amounts">👁</button> <button class="ghost" id="sync">Connect Google Drive</button></div>
</header>
<div id="view"></div>
<div class="card">
  <span class="lab">Currency symbol</span> <input id="cur" style="width:70px">
  <button class="ghost" id="exp">Export backup</button>
  <button class="ghost" id="imp">Import backup</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="ghost danger" id="delall">Delete all data</button>
</div>
</main>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/prices.js"></script>
<script src="js/sync.js"></script>
<script src="js/tabs/dashboard.js"></script>
<script src="js/tabs/ledger.js"></script>
<script src="js/tabs/income.js"></script>
<script src="js/tabs/expenses.js"></script>
<script src="js/tabs/investments.js"></script>
<script src="js/tabs/liabilities.js"></script>
<script src="js/tabs/transfers.js"></script>
<script src="js/tabs/allocation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
